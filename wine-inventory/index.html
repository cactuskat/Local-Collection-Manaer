<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wine Collection Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Wine Collection Manager</h1>
    <div class="nav">
        <button type="submit" onclick="showView('table-view')">Inventory</button>
        <button type="submit" onclick="showView('form-view')" id="addBtn">Add Wine</button>
        <button type="submit" onclick="showView('stats-view')">Stats</button>
    </div>

    <h3 id="page-view"></h3>

    <div id="table-view" style="display:none">
        <table id="wineTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Year</th>
                    <th>Type</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="wineTableBody"></tbody>
        </table>
    </div>

    <div id="form-view" style="display:none">
        <form id="wineForm">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required><br>

            <label for="year">Year:</label>
            <input type="number" id="year" name="year" min="1900" max="2026" required><br>

            <label for="type">Type:</label>
            <select id="type" name="type" required>
            </select><br>

            <label for="status">Status:</label>
            <select id="status" name="status" required>
                <option value="Open">Open</option>
                <option value="Sealed">Sealed</option>
            </select><br>

            <button type="submit" id="submitBtn">Submit</button>
        </form>
    </div>

    <div id="stats-view" style="display:none;">
        <h2>Stats</h2>
        <ul id="stats-list"></ul>
    </div>

<script src="script.js"></script>
</body>
</html>
